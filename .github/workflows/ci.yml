name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 cannot load the `.ts` test files (they run without a build
        # step and need native type stripping), so it would only ever be red.
        node-version: [22.x, 26.x]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Lets npm verify the release through trusted publishing instead of a
      # long-lived token, when the package has a trusted publisher configured.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - name: Semantic Release
        run: |
          set +e
          npx semantic-release --debug > /tmp/semantic-release.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Annotations are readable without a token, the log is not: surface
            # the lines that name the failure, not the stack frames.
            sed -r 's/\x1b\[[0-9;]*m//g' /tmp/semantic-release.log \
              | grep -aE "Failed step|An error occurred|AggregateError|E[A-Z]+:|EAR|ENO|403|401" \
              | head -n 8 \
              | while IFS= read -r line; do
                  echo "::error title=semantic-release::${line}"
                done
          fi
          exit $status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @semantic-release/npm reads NPM_TOKEN. NODE_AUTH_TOKEN only ever
          # worked through the placeholder .npmrc that setup-node writes for
          # registry-url; naming the variable the plugin reads removes that
          # indirection. The sibling pi-* repositories release this way.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
