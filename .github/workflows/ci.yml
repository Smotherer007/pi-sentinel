name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 cannot load the `.ts` test files (they run without a build
        # step and need native type stripping), so it would only ever be red.
        node-version: [22.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The tests whose synchronisation was once a sleep fail under *load*, not in
      # isolation — which is exactly how they reached a real session as red turns
      # and sent the repair loop after a flake. Run them concurrently here, where
      # that load exists on purpose.
      - name: Flake candidates, under parallel load
        run: |
          set -e
          node --test --test-name-pattern="a turn that arrives during a running check" tests/extension.test.ts > /tmp/flake-1.log 2>&1 &
          node --test --test-name-pattern="staleness" tests/staleness-wiring.test.ts > /tmp/flake-2.log 2>&1 &
          node --test --test-name-pattern="kills the whole process tree" tests/runner.test.ts > /tmp/flake-3.log 2>&1 &
          node --test --test-name-pattern="a green run clears a stall" tests/extension.test.ts > /tmp/flake-4.log 2>&1 &
          wait
          ! grep -q "^not ok" /tmp/flake-*.log
      # The eval is a check, not a report: each trajectory declares what sentinel
      # should do and the runner fails when the measurement disagrees. Registered
      # here so the numbers in `evals/README.md` cannot rot into prose.
      - name: Behavioural evals
        run: node evals/run.mjs

  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Semantic Release
        run: npx semantic-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
